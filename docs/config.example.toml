# Tancrède — example configuration for the `real` profile.
# Copy to config.toml in %LOCALAPPDATA%\Tancrede (Windows) or ~/.local/share/Tancrede (Linux) and adapt. Never commit a real config.

# "enclave": guardrails enforced in code (SPEC §4). "open": no restriction, you are warned.
mode = "enclave"

# Folders Tancrède may read (read-only).
allowed_folders = [
    # 'C:\Users\you\Documents\Notes',   # Windows
    # '/home/you/Notes',                  # Linux
]

# Files or folders never read, even inside allowed folders.
excluded_paths = []

default_gateway = "local"
eval_journal = false

# Optional per-task routing (answer, summarize, extract, classify_topic, tag).
[routing]
# tag = "local"

# Any OpenAI-compatible endpoint. Ollama listens on http://localhost:11434/v1.
[gateways.local]
type = "openai"
base_url = "http://localhost:11434/v1"
model = "llama3.1:8b"
# api_key = "..."   # only for cloud APIs; keep this file private

[enclave]
# Hosts reachable besides localhost, and plugins allowed to load.
allowed_hosts = []
allowed_plugins = []

# Labels: content carrying an excluded label is never indexed nor sent to a model.
[[classification.excluded_labels]]
name = "EXAMPLE-SECRET"
patterns = ["EXAMPLE-SECRET"]

[[classification.included_labels]]
name = "EXAMPLE-INTERNAL"
patterns = ["EXAMPLE-INTERNAL"]
