[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tancrede"
version = "0.1.0.dev0"
description = "Tancrède: a desktop assistant for notes, projects and cognitive load."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "skitourer" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.urls]
Repository = "https://github.com/Skitourer/tancrede"

[project.scripts]
tancrede = "tancrede.app.cli:main"

[dependency-groups]
dev = [
    "detect-secrets>=1.5",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tancrede"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "PTH"]
ignore = [
    "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
